name: HourBoostr

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  hourboostr:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Download HourBoostr
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Ezzpify/HourBoostr/releases/download/3.2.1/Release.rar"
          $archive = Join-Path $env:RUNNER_TEMP "Release.rar"
          $folder = Join-Path $env:RUNNER_TEMP "HourBoostr"

          Invoke-WebRequest -Uri $url -OutFile $archive

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip was not found on the runner."
          }

          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          & $sevenZip x $archive "-o$folder" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Archive extraction failed."
          }

          $exe = Get-ChildItem $folder -Filter "HourBoostr.exe" -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "HourBoostr.exe was not found after extraction."
          }

          $expected = "14D147B084BEB8F4522338DD72B044DB"
          $actual = (Get-FileHash $exe.FullName -Algorithm MD5).Hash

          Write-Host "HourBoostr EXE MD5: $actual"

          if ($actual -ne $expected) {
            throw "Executable checksum mismatch. Stopping."
          }

          Write-Host "Executable checksum verified."

          $exePath = $exe.FullName
          "HOURBOOSTR_EXE=$exePath" >> $env:GITHUB_ENV

      - name: Launch HourBoostr
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $process = Start-Process `
            -FilePath $env:HOURBOOSTR_EXE `
            -PassThru

          Write-Host "HourBoostr started. PID: $($process.Id)"
          Start-Sleep -Seconds 20

          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force
            Write-Host "Test finished; process stopped."
          }
          else {
            Write-Host "HourBoostr exited on its own."
          }
