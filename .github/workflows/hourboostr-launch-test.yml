name: HourBoostr Download Diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Download official release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Ezzpify/HourBoostr/releases/download/3.2.1/Release.rar"
          $archive = Join-Path $env:RUNNER_TEMP "Release.rar"

          Write-Host "Downloading official HourBoostr release..."
          Invoke-WebRequest -Uri $url -OutFile $archive

          if (!(Test-Path $archive)) {
            throw "Download failed: archive was not created."
          }

          $file = Get-Item $archive
          $hash = (Get-FileHash $archive -Algorithm MD5).Hash

          Write-Host ""
          Write-Host "========== DIAGNOSTIC RESULTS =========="
          Write-Host "Downloaded archive MD5: $hash"
          Write-Host "Downloaded archive size: $($file.Length) bytes"
          Write-Host "Expected archive MD5: 6D4584F02318F4EC47302212FD65E0E1"
          Write-Host "Expected archive size: 2901027 bytes"
          Write-Host "========================================"
          Write-Host ""

          throw "Diagnostic only. Stopped before extraction or execution."
